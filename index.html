<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Conecsa Go</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="LogoConecsa.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style type="text/tailwindcss">
  @layer components {
    .inp   { @apply w-full p-2.5 border border-slate-200 rounded-lg bg-slate-50 text-sm focus:bg-white focus:outline-none focus:border-[#0B1320]; }
    .lbl   { @apply block text-xs font-semibold text-slate-500 mb-1; }
    .btn   { @apply inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-sm font-bold transition active:scale-95 disabled:opacity-50 min-h-[40px]; }
    .btn-sm { @apply !py-1.5 !text-xs min-h-[36px]; }
    .btn-pri { @apply bg-[#0B1320] text-white hover:bg-slate-800; }
    .btn-acc { @apply bg-amber-500 text-[#0B1320] hover:bg-amber-400; }
    .btn-sec { @apply bg-white border border-slate-200 text-slate-600 hover:bg-slate-50; }
    .btn-del { @apply bg-white border border-red-200 text-red-600 hover:bg-red-50; }
    .card  { @apply bg-white rounded-xl border border-slate-200 shadow-sm; }
    .chip  { @apply inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-full whitespace-nowrap; }
    .filtro { @apply inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-full whitespace-nowrap border transition min-h-[36px]; }
    .filtro-on  { @apply bg-[#0B1320] border-[#0B1320] text-white; }
    .filtro-off { @apply bg-white border-slate-200 text-slate-600 hover:bg-slate-50; }
    .meta  { @apply text-xs font-medium text-slate-500; }
    .seccion { @apply text-[11px] font-bold text-slate-500 uppercase tracking-wider; }
    .seg   { @apply px-4 py-1.5 rounded-full text-sm font-semibold transition whitespace-nowrap; }
    .seg-on  { @apply bg-[#0B1320] text-white shadow-sm; }
    .seg-off { @apply bg-white border border-slate-200 text-slate-500 hover:bg-slate-50; }
    .vacio { @apply text-center text-slate-500 py-10 text-sm; }
  }
</style>
<style>
  /* superficies del navegador tematizadas con la paleta */
  html { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Figtree', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; }
  ::selection { background: #fde68a; color: #0B1320; }
  input, textarea, select { caret-color: #F59E0B; accent-color: #0B1320; }
  ::placeholder { color: #64748b; opacity: 1; }
  :focus-visible { outline: 2px solid #F59E0B; outline-offset: 2px; border-radius: 6px; }
  input:focus-visible, textarea:focus-visible, select:focus-visible { outline-offset: 0; }
  h1, h2, h3 { text-wrap: balance; }
  .nav-bottom { padding-bottom: max(env(safe-area-inset-bottom), 8px); }
  .tab-on { color: #0B1320; }
  .tab-on svg { stroke: #F59E0B; stroke-width: 2.2; transform: translateY(-2px); transition: all .2s; }
  .tab-off { color: #9ca3af; }
  .tab-off svg { stroke: #9ca3af; stroke-width: 1.5; transition: all .2s; }

  /* estados de tareas */
  .est-pendiente{background:#fef3c7;color:#92400e}
  .est-en_curso,.est-en_proceso{background:#dbeafe;color:#1e40af}
  .est-hecha{background:#d1fae5;color:#065f46}

  /* semáforo de vencimientos */
  .b-rojo{background:#fee2e2;color:#991b1b}
  .b-ambar{background:#fef3c7;color:#92400e}
  .b-verde{background:#d1fae5;color:#065f46}
  .b-gris{background:#f1f5f9;color:#475569}

  /* pasos DMAIC */
  .step{width:28px;height:28px;border-radius:9999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
  .step-done{background:#0B1320;color:#fff}
  .step-on{background:#F59E0B;color:#0B1320;box-shadow:0 0 0 3px #fde68a}
  .step-off{background:#e2e8f0;color:#94a3b8}
  .step-line{flex:1;height:2px;background:#e2e8f0;min-width:8px}

  /* tablero kanban: columnas deslizables en móvil, grilla en escritorio */
  .kanban{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
  .kanban>.col{min-width:84%;scroll-snap-align:center;flex:none}
  @media(min-width:768px){.kanban{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible}.kanban>.col{min-width:0}}

  /* hoja inferior y avisos emergentes */
  @keyframes subir{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .sheet-panel{animation:subir .18s ease-out}
  .toast{background:#0B1320;color:#fff;font-size:13px;font-weight:600;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:subir .18s ease-out}
  .toast-err{background:#b91c1c}
  @media(prefers-reduced-motion:reduce){.sheet-panel,.toast{animation:none}}
  .kanban::-webkit-scrollbar,.scroll-x::-webkit-scrollbar{display:none}

  /* impresión / PDF del informe mensual */
  @media print{
    @page{margin:14mm}
    header,nav,#toasts,#sheet,.no-print{display:none!important}
    body{background:#fff!important}
    main{padding:0!important;max-width:none!important}
    #v-flota{display:block!important}
    .card{box-shadow:none!important;break-inside:avoid}
  }
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<!-- PANTALLA DE CARGA: evita ver el login un instante antes de entrar a la app -->
<div id="splash" class="fixed inset-0 z-[100] bg-[#0B1320] flex flex-col items-center justify-center gap-4">
  <img src="LogoConecsa.jpg" alt="" class="h-20 w-20 rounded-full bg-white p-1 object-contain">
  <div class="w-6 h-6 border-2 border-white/30 border-t-amber-400 rounded-full animate-spin"></div>
</div>

<!-- LOGIN -->
<div id="login" class="hidden min-h-screen bg-[#0B1320] flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <img src="LogoConecsa.jpg" alt="Conecsa" class="h-24 w-24 rounded-full bg-white p-1 object-contain mx-auto mb-4 shadow-lg">
      <h1 class="text-white text-2xl font-bold tracking-wide">Conecsa Go</h1>
      <p class="text-slate-300 text-sm mt-1">Acceso operativo</p>
    </div>
    <form onsubmit="iniciarSesion(); return false;" class="bg-white p-6 rounded-2xl shadow-xl">
      <label class="lbl" for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="username" inputmode="email" placeholder="usuario@conecsa.com" class="inp mb-3 !p-3">
      <label class="lbl" for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" class="inp mb-5 !p-3">
      <button id="btn-entrar" type="submit" class="btn btn-acc w-full !py-3 !text-base">Entrar</button>
      <p id="error-msg" class="text-red-600 text-sm text-center mt-4 hidden"></p>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="bg-[#0B1320] text-white px-4 py-3 flex justify-between items-center sticky top-0 z-10 shadow-sm">
    <div class="flex items-center gap-3 min-w-0">
      <img src="LogoConecsa.jpg" alt="" class="h-9 w-9 bg-white rounded-full p-0.5 object-contain flex-none">
      <div class="leading-tight min-w-0">
        <div class="font-bold tracking-wide">Conecsa Go</div>
        <div id="quien" class="text-xs text-slate-300 truncate"></div>
      </div>
    </div>
    <button onclick="cerrarSesion()" class="text-xs bg-slate-700/50 border border-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-600 transition flex-none">Salir</button>
  </header>

  <main class="max-w-5xl mx-auto p-4 pb-28">
    <!-- Biblioteca: Formularios / Procesos / Data -->
    <section id="v-biblioteca" class="max-w-2xl mx-auto">
      <div id="bib-seg" class="flex gap-2 mb-4 overflow-x-auto scroll-x"></div>
      <input id="buscar" oninput="pintarRecursos()" placeholder="Buscar documento..." class="w-full p-3 mb-4 border border-slate-200 rounded-xl bg-white shadow-sm text-sm focus:outline-none focus:border-[#0B1320]">
      <div id="lista-recursos"></div>
    </section>

    <!-- Avisos -->
    <section id="v-avisos" class="hidden max-w-2xl mx-auto">
      <div id="form-aviso" class="hidden bg-blue-50/50 rounded-xl border border-blue-100 p-4 mb-5">
        <h2 class="font-bold text-blue-800 mb-2">Publicar nuevo aviso</h2>
        <textarea id="a-mensaje" rows="2" placeholder="Escribe el comunicado..." class="w-full p-2.5 mb-2 border border-blue-200 rounded-lg focus:outline-none focus:border-blue-500 bg-white text-sm"></textarea>
        <input id="a-img" type="url" placeholder="URL de imagen (opcional)" class="w-full p-2.5 mb-3 border border-blue-200 rounded-lg focus:outline-none focus:border-blue-500 bg-white text-sm">
        <button onclick="lock(this, crearAviso)" class="btn w-full bg-blue-600 hover:bg-blue-700 text-white">Enviar a todos</button>
      </div>
      <div id="lista-avisos"></div>
    </section>

    <!-- Tareas -->
    <section id="v-tareas" class="hidden max-w-2xl mx-auto">
      <div class="flex gap-2 mb-4 overflow-x-auto scroll-x">
        <button id="sub-mias" onclick="subTareas('mias')" class="sub seg">Mis tareas</button>
        <button id="sub-dadas" onclick="subTareas('dadas')" class="sub seg">Las que asigné</button>
        <button id="sub-proy" onclick="subTareas('proy')" class="sub seg">De proyectos</button>
        <button onclick="toggleForm()" class="btn btn-acc ml-auto flex-none whitespace-nowrap !rounded-full !py-1.5">+ Nueva</button>
      </div>
      <div id="form-tarea" class="hidden card p-4 mb-4">
        <input id="t-titulo" placeholder="¿Qué hay que hacer?" class="inp mb-2">
        <textarea id="t-desc" rows="2" placeholder="Detalle adicional (opcional)" class="inp mb-2"></textarea>
        <select id="t-prio" class="inp mb-2"><option value="baja">Prioridad baja</option><option value="media" selected>Prioridad media</option><option value="alta">Prioridad alta</option></select>
        <div class="grid grid-cols-2 gap-2 mb-3">
          <label class="block"><span class="lbl">Fecha límite</span><input id="t-fecha" type="date" class="inp"></label>
          <label class="block"><span class="lbl">Hora límite (opcional)</span><input id="t-hora" type="time" class="inp"></label>
        </div>
        <div id="bloque-asignar">
          <div class="text-sm font-semibold mb-2 text-slate-700">Asignar a:</div>
          <div id="chips-rol" class="flex flex-wrap gap-1.5 mb-2"></div>
          <div id="lista-usuarios" class="max-h-40 overflow-y-auto border rounded-lg divide-y bg-slate-50"></div>
        </div>
        <p id="t-hint" class="text-xs text-slate-500 mt-2 hidden text-center bg-slate-100 p-2 rounded-lg">Esta tarea será exclusivamente para ti.</p>
        <button onclick="lock(this, crearTarea)" class="btn btn-pri w-full mt-3 !py-3">Crear tarea</button>
      </div>
      <div id="lista-tareas"></div>
    </section>

    <!-- Mejora continua y Flota se dibujan desde mejora.js / flota.js -->
    <section id="v-mejora" class="hidden"></section>
    <section id="v-flota" class="hidden"></section>
  </main>

  <nav class="bg-white border-t border-slate-200 flex max-w-2xl mx-auto fixed bottom-0 w-full z-50 left-1/2 -translate-x-1/2 nav-bottom shadow-[0_-4px_20px_rgba(0,0,0,0.04)]">
    <button data-tab="biblioteca" class="tab flex-1 pt-3 pb-2 flex flex-col items-center gap-1 font-semibold text-[11px]">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
      <span>Biblioteca</span>
    </button>
    <button data-tab="avisos" class="tab flex-1 pt-3 pb-2 flex flex-col items-center gap-1 font-semibold text-[11px]">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/></svg>
      <span>Avisos</span>
    </button>
    <button data-tab="tareas" class="tab flex-1 pt-3 pb-2 flex flex-col items-center gap-1 font-semibold text-[11px] relative">
      <span id="badge" class="hidden absolute top-1.5 right-3 sm:right-1/4 text-[10px] bg-red-600 text-white font-bold rounded-full h-4 min-w-4 px-1 flex items-center justify-center shadow-sm"></span>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z"/></svg>
      <span>Tareas</span>
    </button>
    <button data-tab="mejora" class="tab flex-1 pt-3 pb-2 flex flex-col items-center gap-1 font-semibold text-[11px] relative">
      <span id="badge-mejora" class="hidden absolute top-1.5 right-3 sm:right-1/4 text-[10px] bg-red-600 text-white font-bold rounded-full h-4 min-w-4 px-1 flex items-center justify-center shadow-sm"></span>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M9 4.5v15m6-15v15m-10.875 0h15.75c.621 0 1.125-.504 1.125-1.125V5.625c0-.621-.504-1.125-1.125-1.125H4.125C3.504 4.5 3 5.004 3 5.625v12.75c0 .621.504 1.125 1.125 1.125z"/></svg>
      <span>Mejora</span>
    </button>
    <button id="tab-flota" data-tab="flota" class="tab hidden flex-1 pt-3 pb-2 flex flex-col items-center gap-1 font-semibold text-[11px]">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.125-.504 1.125-1.125v-4.875c0-.42-.176-.826-.489-1.119l-3.2-3.2a1.125 1.125 0 00-.795-.33H15.75M2.25 14.25V6.375c0-.621.504-1.125 1.125-1.125h9.75c.621 0 1.125.504 1.125 1.125V14.25m-17.25 0h17.25"/></svg>
      <span>Flota</span>
    </button>
  </nav>

  <!-- Hoja inferior reutilizable para formularios y detalles -->
  <div id="sheet" class="hidden fixed inset-0 z-[60] flex items-end sm:items-center justify-center">
    <div class="absolute inset-0 bg-black/50" onclick="cerrarSheet()"></div>
    <div class="sheet-panel relative bg-white w-full max-w-lg max-h-[92vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl shadow-2xl">
      <div class="sticky top-0 bg-white border-b border-slate-100 px-4 py-3 flex items-center justify-between z-10">
        <h2 id="sheet-titulo" class="font-bold text-slate-800"></h2>
        <button onclick="cerrarSheet()" aria-label="Cerrar" class="text-slate-500 hover:text-slate-700 text-2xl leading-none px-1">&times;</button>
      </div>
      <div id="sheet-body" class="p-4 pb-6"></div>
    </div>
  </div>
</div>

<div id="toasts" class="fixed top-16 left-0 right-0 z-[120] flex flex-col items-center gap-2 pointer-events-none px-4"></div>

<script src="app.js"></script>
<script src="mejora.js"></script>
<script src="flota.js"></script>
<script src="informe.js"></script>
<script>arrancar();</script>
</body>
</html>
